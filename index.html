<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CoRide Robotaxi Demo Suite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060a10;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
.wrap{width:600px;text-align:center}
h1{font-size:28px;color:#e0e0e0;margin-bottom:6px;letter-spacing:1px}
.sub{font-size:12px;color:#556;margin-bottom:32px;letter-spacing:2px}
.grid{display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:16px;background:#0d131c;border:1px solid #1a2835;border-radius:12px;padding:18px 24px;text-decoration:none;transition:all .25s}
.card:hover{border-color:#4facfe;box-shadow:0 0 30px rgba(79,172,254,.1);transform:translateX(6px)}
.card-icon{font-size:32px;flex-shrink:0;width:48px;text-align:center}
.card-info{text-align:left}
.card-title{font-size:16px;font-weight:700;color:#ccc;margin-bottom:4px}
.card-desc{font-size:10px;color:#556}
.card-badge{font-size:9px;color:#4facfe;border:1px solid rgba(79,172,254,.2);padding:2px 8px;border-radius:10px;display:inline-block;margin-top:4px}
footer{font-size:10px;color:#333;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<h1>🚀 CoRide Robotaxi</h1>
<div class="sub">智能座舱 Agent 演示套件</div>
<div class="grid">
<a class="card" href="ClientGui/">
<div class="card-icon">📱</div>
<div class="card-info"><div class="card-title">1 · 用户手机 App</div><div class="card-desc">注册→叫车→比价→蓝牙握手→评价</div><span class="card-badge">瘦客户端</span></div>
</a>
<a class="card" href="InCarGui/">
<div class="card-icon">🚗</div>
<div class="card-info"><div class="card-title">2 · 车内交互界面</div><div class="card-desc">车道导航·地图全景·语音·座椅·多媒体</div><span class="card-badge">Jetson Orin Nano</span></div>
</a>
<a class="card" href="PlatformAdmin/">
<div class="card-icon">🏛</div>
<div class="card-info"><div class="card-title">3 · CoRide 运营后台</div><div class="card-desc">KPI看板·订单流·评分·车辆·财务·6个二级页</div><span class="card-badge">平台管理</span></div>
</a>
<a class="card" href="OperatorAdmin/">
<div class="card-icon">🤖</div>
<div class="card-info"><div class="card-title">4 · 运营商后台</div><div class="card-desc">热力图·车辆状态·趋势图·Jet健康</div><span class="card-badge">小马智行·Teal主题</span></div>
</a>
<a class="card" href="SystemArch/">
<div class="card-icon">🏗</div>
<div class="card-info"><div class="card-title">5 · 系统架构全景图</div><div class="card-desc">四层架构·三色数据流·财务模型·6个二级页</div><span class="card-badge">架构设计</span></div>
</a>
</div>
<footer>CoRide · 双端协同 · 三层架构 · 安全隔离</footer>
</div>
</body>
</html>
