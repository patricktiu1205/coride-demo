<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CoRide 运营商后台 · 登录</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

<div style="position:fixed;top:16px;right:16px;z-index:10">
  <div class="theme-toggle" onclick="toggleTheme()" title="切换日/夜模式" id="themeToggle" style="font-size:22px;padding:8px 10px">🌙</div>
</div>

<div class="login-card">
  <div class="login-logo" id="loginBrand">🏢 CoRide 运营商后台</div>
  <div class="login-sub">Robotaxi 车队运营管理平台</div>

  <div class="login-field">
    <label>运营商账号</label>
    <input type="text" id="loginUser" placeholder="请输入运营商账号" value="xiaoma@coride.cn">
  </div>
  <div class="login-field">
    <label>密码</label>
    <input type="password" id="loginPass" placeholder="请输入密码" value="admin123">
  </div>
  <div class="login-row">
    <div class="login-field">
      <label>验证码</label>
      <input type="text" id="loginCode" placeholder="验证码" value="A3B9">
    </div>
    <div class="login-field">
      <label>&nbsp;</label>
      <div style="padding:12px;background:var(--bg-secondary);border:1px solid var(--border-accent);border-radius:8px;text-align:center;font-size:20px;font-weight:700;color:var(--orange);letter-spacing:4px;font-family:monospace;user-select:none" id="codeDisplay">A3B9</div>
    </div>
  </div>

  <div class="login-hint">
    演示账号：<br>
    <b>xiaoma@coride.cn</b> · 小马智行<br>
    <b>wenyuan@coride.cn</b> · 文远知行<br>
    <b>apollo@coride.cn</b> · 百度Apollo<br>
    <b>autox@coride.cn</b> · AutoX 安途<br>
    统一密码：<b>admin123</b>
  </div>

  <button class="login-btn" onclick="handleLogin()">登 录</button>
  <div class="login-err" id="loginErr"></div>
  <div class="login-footer">CoRide Operator Console v2.0 · © 2026</div>
</div>

<script>
// ═══ THEME ═══
function applyTheme(theme) {
  document.body.classList.toggle("light-theme", theme === "light");
  document.getElementById("themeToggle").textContent = theme === "light" ? "☀️" : "🌙";
  localStorage.setItem("op_theme", theme);
}
function toggleTheme() {
  var current = document.body.classList.contains("light-theme") ? "dark" : "light";
  applyTheme(current);
}
(function(){
  var saved = localStorage.getItem("op_theme") || "dark";
  applyTheme(saved);
})();

// ═══ OPERATOR ACCOUNTS ═══
var operatorAccounts = {
  "xiaoma@coride.cn":  { id: "PX", name: "小马智行",   avatar: "🤖", color: "#F5A623", brand: "🤖 小马智行 · 运营商后台" },
  "wenyuan@coride.cn": { id: "WR", name: "文远知行",   avatar: "🚗", color: "#4facfe", brand: "🚗 文远知行 · 运营商后台" },
  "apollo@coride.cn":  { id: "AP", name: "百度Apollo", avatar: "🚕", color: "#2ecc71", brand: "🚕 百度Apollo · 运营商后台" },
  "autox@coride.cn":   { id: "AX", name: "AutoX 安途", avatar: "🛵", color: "#e74c3c", brand: "🛵 AutoX 安途 · 运营商后台" }
};

function refreshCode() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('codeDisplay').textContent = code;
  document.getElementById('loginCode').value = '';
}
document.getElementById('codeDisplay').onclick = refreshCode;

function handleLogin() {
  var user = document.getElementById('loginUser').value.trim().toLowerCase();
  var pass = document.getElementById('loginPass').value.trim();
  var code = document.getElementById('loginCode').value.trim().toUpperCase();
  var realCode = document.getElementById('codeDisplay').textContent;
  var err = document.getElementById('loginErr');

  if (!user || !pass) { err.textContent = '请输入账号和密码'; return; }
  if (code !== realCode) { err.textContent = '验证码错误'; refreshCode(); return; }
  if (pass !== 'admin123') { err.textContent = '密码错误'; return; }
  if (!operatorAccounts[user]) { err.textContent = '账号不存在，请使用演示账号'; return; }

  err.textContent = '';
  var op = operatorAccounts[user];
  sessionStorage.setItem('op_logged_in', '1');
  sessionStorage.setItem('op_id', op.id);
  sessionStorage.setItem('op_name', op.name);
  sessionStorage.setItem('op_avatar', op.avatar);
  sessionStorage.setItem('op_color', op.color);
  window.location.href = 'index.html';
}

document.getElementById('loginPass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleLogin();
});
</script>

</body>
</html>
