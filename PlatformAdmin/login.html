<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CoRide 运营中心 · 登录</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

<div style="position:fixed;top:16px;right:16px;z-index:10">
  <div class="theme-toggle" onclick="toggleTheme()" title="切换日/夜模式" id="themeToggle" style="font-size:22px;padding:8px 10px">🌙</div>
</div>

<div class="login-card">
  <div class="login-logo">🤖 CoRide 运营中心</div>
  <div class="login-sub">统一管理四大 RoboTaxi 平台</div>

  <div class="login-field">
    <label>账号</label>
    <input type="text" id="loginUser" placeholder="请输入管理员账号" value="admin@coride.cn">
  </div>
  <div class="login-field">
    <label>密码</label>
    <input type="password" id="loginPass" placeholder="请输入密码" value="admin123">
  </div>
  <div class="login-row">
    <div class="login-field">
      <label>验证码</label>
      <input type="text" id="loginCode" placeholder="验证码" value="A3B9">
    </div>
    <div class="login-field">
      <label>&nbsp;</label>
      <div style="padding:12px;background:var(--bg-secondary);border:1px solid var(--border-accent);border-radius:8px;text-align:center;font-size:20px;font-weight:700;color:var(--orange);letter-spacing:4px;font-family:monospace;user-select:none" id="codeDisplay">A3B9</div>
    </div>
  </div>

  <button class="login-btn" onclick="handleLogin()">登 录</button>
  <div class="login-err" id="loginErr"></div>
  <div class="login-footer">CoRide Admin Console v2.0 · © 2026</div>
</div>

<script>
// ═══ THEME ═══
function applyTheme(theme) {
  document.body.classList.toggle("light-theme", theme === "light");
  document.getElementById("themeToggle").textContent = theme === "light" ? "☀️" : "🌙";
  localStorage.setItem("coride_theme", theme);
}
function toggleTheme() {
  var current = document.body.classList.contains("light-theme") ? "dark" : "light";
  applyTheme(current);
}
(function(){
  var saved = localStorage.getItem("coride_theme") || "dark";
  applyTheme(saved);
})();

function refreshCode() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('codeDisplay').textContent = code;
  document.getElementById('loginCode').value = '';
}
document.getElementById('codeDisplay').onclick = refreshCode;

function handleLogin() {
  var user = document.getElementById('loginUser').value.trim();
  var pass = document.getElementById('loginPass').value.trim();
  var code = document.getElementById('loginCode').value.trim().toUpperCase();
  var realCode = document.getElementById('codeDisplay').textContent;
  var err = document.getElementById('loginErr');

  if (!user || !pass) { err.textContent = '请输入账号和密码'; return; }
  if (code !== realCode) { err.textContent = '验证码错误'; refreshCode(); return; }
  if (pass !== 'admin123') { err.textContent = '密码错误'; return; }

  err.textContent = '';
  sessionStorage.setItem('coride_logged_in', '1');
  sessionStorage.setItem('coride_user', user);
  window.location.href = 'index.html';
}

document.getElementById('loginPass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleLogin();
});
</script>

</body>
</html>
